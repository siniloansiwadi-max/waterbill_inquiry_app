<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="description" content="SIWADI Services – GCash payment guide, new connection, water rates.">
  <title>Services & Guides · SIWADI</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e3c72;
      --primary-dark: #12264c;
      --primary-light: #2a5298;
      --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    /* 📱 MAIN CARD */
    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 28px 20px;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      text-align: center;
      width: 100%;
      max-width: 520px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* 🖼️ LOGO */
    #site-logo {
      width: 90px;
      height: auto;
      margin: 0 auto 12px auto;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    h1 {
      color: var(--primary);
      margin: 0 0 6px 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* 🗂️ SERVICES GRID */
    .services-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 10px;
    }

    .service-card {
      background: #f8fafc;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .service-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary-light);
    }

    .service-card:active {
      transform: scale(0.98);
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 10px 14px;
      text-align: left;
    }

    .card-header h3 {
      font-size: 13px;
      font-weight: 700;
    }

    .image-area {
      padding: 10px;
      background: #ffffff;
      text-align: center;
    }

    .service-img {
      max-width: 100%;
      height: 180px;
      border-radius: 8px;
      object-fit: cover;
      width: 100%;
      background: #f1f5f9;
      display: block;
    }

    .image-note {
      margin-top: 8px;
      color: var(--primary-light);
      font-size: 11px;
      font-weight: 600;
    }

    /* 🔍 FULLSCREEN IMAGE MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-img {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      font-size: 1.6rem;
      color: white;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover, .modal-close:active {
      background: white;
      color: var(--primary-dark);
    }

    /* 🔗 BOTTOM ACTION BUTTON (PORTAL HOME) */
    .new-button-container {
      margin-top: 20px;
      width: 100%;
      max-width: 520px;
    }

    .new-button-container a {
      display: block;
      text-decoration: none;
      width: 100%;
    }

    .action-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15) !important;
      backdrop-filter: blur(8px);
      color: white !important;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 14px;
      padding: 14px;
      margin: 0 !important;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.25) !important;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 380px) {
      .container { padding: 20px 14px; }
      h1 { font-size: 1.35rem; }
      .service-img { height: 150px; }
    }
  </style>
</head>

<body>

<div class="container">
  <img src="swdmascot.png" alt="SIWADI Mascot" id="site-logo" onerror="this.src='siwadilogo.png'">
  <h1>Services & Guides</h1>
  <p class="subtitle">Pindutin ang larawan upang buksan nang buo (fullscreen).</p>

  <div class="services-grid">
    <!-- GCash Card -->
    <div class="service-card" onclick="openModal('images/gcash.jpg')">
      <div class="card-header">
        <h3>💳 GCash Payment Guide</h3>
      </div>
      <div class="image-area">
        <img src="images/gcash.jpg" alt="GCash Guide" class="service-img" onerror="this.src='gcash.jpg'">
        <div class="image-note">🔍 Tap to view fullscreen</div>
      </div>
    </div>

    <!-- New Connection Card -->
    <div class="service-card" onclick="openModal('images/newconnection.png')">
      <div class="card-header">
        <h3>🔧 New Connection Application</h3>
      </div>
      <div class="image-area">
        <img src="images/newconnection.png" alt="New Connection" class="service-img" onerror="this.src='newconnection.png'">
        <div class="image-note">🔍 Tap to view fullscreen</div>
      </div>
    </div>

    <!-- Water Rates Card -->
    <div class="service-card" onclick="openModal('images/rates.jpg')">
      <div class="card-header">
        <h3>📊 Water Rates Schedule</h3>
      </div>
      <div class="image-area">
        <img src="images/rates.jpg" alt="Water Rates" class="service-img" onerror="this.src='rates.jpg'">
        <div class="image-note">🔍 Tap to view fullscreen</div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Action Link (Portal Home) -->
<div class="new-button-container">
  <a href="index.html">
    <button type="button" class="action-btn">🏠 Bumalik sa Portal</button>
  </a>
</div>

<!-- Fullscreen Image Modal -->
<div id="imageModal" class="modal" onclick="closeModal()">
  <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
  <img id="modalImg" class="modal-img" src="" alt="Fullscreen Guide" onclick="event.stopPropagation()">
</div>

<script>
  function openModal(imgSrc) {
    document.getElementById('modalImg').src = imgSrc;
    document.getElementById('imageModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('imageModal').classList.remove('active');
    document.body.style.overflow = 'auto';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>
